<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đào Tạo DevOps</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #007bff; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chủ Đề: Deploy HTML Đầu Tiên</h1>
        <p>Chúc mừng! Trang web HTML này đã được deploy thành công lên Internet!</p>
    </div>
</body>
</html>
